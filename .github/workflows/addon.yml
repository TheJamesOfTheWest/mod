name: Build ReShade add-on (MSVC)
on:
  push:
    paths: ["addon/**", ".github/workflows/addon.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile
        shell: cmd
        run: |
          mkdir out
          cl /nologo /LD /O2 /EHsc /std:c++20 /MT /W3 /DWIN32_LEAN_AND_MEAN /DNOMINMAX /I addon\third_party\reshade addon\addon_main.cpp addon\compositor.cpp /Fo:out\ /Fe:out\SotfPassthrough.addon64 /link user32.lib
      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp out/SotfPassthrough.addon64 addon/shaders/MCPassthrough.fx addon/shaders/ReShade.fxh addon/shaders/ReShadeUI.fxh pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: sotf-addon
          path: pkg/
